services:
  ka-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ka-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      # 数据库与报告持久化到宿主机项目根目录的 data/
      - ../../data:/data
    environment:
      - DATA_DIR=/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
