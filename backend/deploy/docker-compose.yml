services:
  ka-agent-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ka-agent-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      # 数据库与报告持久化到宿主机项目根目录的 data/
      - ../../data:/data
    environment:
      - DATA_DIR=/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    logging:
      driver: json-file
      options:
        max-size: "10m"

  ka-agent-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ka-agent-worker
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../../data:/data
    environment:
      - DATA_DIR=/data
    command: ["python", "worker.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
